<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Canvas Effects Processor</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #1e1e1e;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 20px;
    }

    .container {
      display: flex;
      gap: 20px;
      align-items: flex-start;
    }

    canvas {
      border: 1px solid #444;
      background: #000;
      max-width: 100%;
      height: auto;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 15px;
      background: #2a2a2a;
      padding: 20px;
      border-radius: 8px;
      min-width: 250px;
    }

    label {
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-size: 14px;
    }

    input[type="range"] {
      width: 100%;
    }

    button {
      padding: 10px;
      background: #007acc;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #005999;
    }
  </style>
</head>
<body>

  <h2>Image Effect Processor</h2>

  <div class="container">
    <canvas id="previewCanvas" width="800" height="500"></canvas>

    <div class="controls">
      <label>
        Upload Image
        <input type="file" id="imageInput" accept="image/*">
      </label>

      <label>
        <input type="checkbox" id="enableRgbSplit" checked> Enable RGB Split
      </label>

      <label>
        RGB Shift Offset
        <input type="range" id="rgbOffset" min="0" max="20" value="4">
      </label>

      <label>
        RGB Opacity
        <input type="range" id="rgbOpacity" min="0" max="1" step="0.05" value="0.3">
      </label>

      <button id="exportBtn">Export High-Res PNG</button>
    </div>
  </div>

  <script>
    const previewCanvas = document.getElementById('previewCanvas');
    const imageInput = document.getElementById('imageInput');
    const enableRgbSplitInput = document.getElementById('enableRgbSplit');
    const rgbOffsetInput = document.getElementById('rgbOffset');
    const rgbOpacityInput = document.getElementById('rgbOpacity');
    const exportBtn = document.getElementById('exportBtn');

    let loadedImage = null;

    // Default placeholder drawing if no image uploaded
    function drawPlaceholder(canvas) {
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#333';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#888';
      ctx.font = '20px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Upload an image to start', canvas.width / 2, canvas.height / 2);
    }

    drawPlaceholder(previewCanvas);

    /**
     * Renders the image with normalized visual effects.
     */
    function renderCanvasEffects(canvas, image, options = {}) {
      if (!image) return;

      const ctx = canvas.getContext('2d', { colorSpace: 'srgb' });
      const width = canvas.width;
      const height = canvas.height;

      // Clear canvas state
      ctx.clearRect(0, 0, width, height);

      // RESOLUTION SCALING: Keeps effect proportion consistent across resolutions
      const referenceWidth = options.referenceWidth || 800;
      const scale = width / referenceWidth;

      // Draw base image
      ctx.globalAlpha = 1.0;
      ctx.globalCompositeOperation = 'source-over';
      ctx.drawImage(image, 0, 0, width, height);

      // RGB SPLIT EFFECT (No blown-out whiteout, subtle alpha channel control)
      if (options.enableRgbSplit) {
        const baseOffset = options.rgbOffset !== undefined ? options.rgbOffset : 4;
        const offsetX = baseOffset * scale;
        const offsetY = baseOffset * scale;

        const splitOpacity = options.rgbOpacity !== undefined ? options.rgbOpacity : 0.3;

        // Offscreen canvas for isolating single-channel passes
        const buffer = document.createElement('canvas');
        buffer.width = width;
        buffer.height = height;
        const bCtx = buffer.getContext('2d');

        // Red Channel Pass
        bCtx.clearRect(0, 0, width, height);
        bCtx.drawImage(image, 0, 0, width, height);
        bCtx.globalCompositeOperation = 'multiply';
        bCtx.fillStyle = '#FF0000';
        bCtx.fillRect(0, 0, width, height);

        ctx.save();
        ctx.globalAlpha = splitOpacity;
        ctx.globalCompositeOperation = 'screen';
        ctx.drawImage(buffer, offsetX, -offsetY, width, height);
        ctx.restore();

        // Cyan Channel Pass
        bCtx.globalCompositeOperation = 'source-over';
        bCtx.clearRect(0, 0, width, height);
        bCtx.drawImage(image, 0, 0, width, height);
        bCtx.globalCompositeOperation = 'multiply';
        bCtx.fillStyle = '#00FFFF';
        bCtx.fillRect(0, 0, width, height);

        ctx.save();
        ctx.globalAlpha = splitOpacity;
        ctx.globalCompositeOperation = 'screen';
        ctx.drawImage(buffer, -offsetX, offsetY, width, height);
        ctx.restore();
      }
    }

    function getOptions() {
      return {
        enableRgbSplit: enableRgbSplitInput.checked,
        rgbOffset: parseFloat(rgbOffsetInput.value),
        rgbOpacity: parseFloat(rgbOpacityInput.value),
        referenceWidth: previewCanvas.width
      };
    }

    function updatePreview() {
      if (loadedImage) {
        renderCanvasEffects(previewCanvas, loadedImage, getOptions());
      }
    }

    // Event Listeners for Live Controls
    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            loadedImage = img;
            updatePreview();
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    enableRgbSplitInput.addEventListener('change', updatePreview);
    rgbOffsetInput.addEventListener('input', updatePreview);
    rgbOpacityInput.addEventListener('input', updatePreview);

    // PNG Export Handler
    exportBtn.addEventListener('click', () => {
      if (!loadedImage) return;

      const exportCanvas = document.createElement('canvas');
      exportCanvas.width = loadedImage.naturalWidth || 1920;
      exportCanvas.height = loadedImage.naturalHeight || 1080;

      renderCanvasEffects(exportCanvas, loadedImage, getOptions());

      const link = document.createElement('a');
      link.download = 'exported-image.png';
      link.href = exportCanvas.toDataURL('image/png');
      link.click();
    });
  </script>
</body>
</html>
