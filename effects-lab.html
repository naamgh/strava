<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Effects Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Big+Shoulders+Display:wght@900&family=Bowlby+One&family=Inter:wght@500;600&family=Rubik:wght@900&display=swap" rel="stylesheet">
<style>
  :root { --panel:#1c1c1e; --fill:rgba(118,118,128,.24); --label2:rgba(235,235,245,.6); --tint:#0a84ff; }
  * { box-sizing:border-box; }
  body { margin:0; background:#000; color:#fff; font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  .page { max-width:1100px; margin:auto; padding:28px 16px 60px; }
  h1 { font-size:28px; margin:0 0 4px; letter-spacing:-.02em; }
  .lede { color:var(--label2); font-size:14px; margin:0 0 16px; max-width:70ch; line-height:1.5; }
  .fx { display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; padding-bottom:4px; margin-bottom:12px; }
  .fx::-webkit-scrollbar { display:none; }
  .fx button { flex:none; font:inherit; font-size:14px; font-weight:600; color:#fff; background:var(--fill); border:0; border-radius:16px; padding:8px 14px; cursor:pointer; }
  .fx button.on { background:#fff; color:#000; }
  .fx .grp { flex:none; align-self:center; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:var(--label2); margin:0 2px 0 8px; }
  .stage { position:relative; border-radius:20px; overflow:hidden; background:#000; }
  .stage.photo { background: radial-gradient(120% 70% at 30% 80%, #3d4a3a 0%, transparent 60%), radial-gradient(90% 60% at 80% 20%, #4c5868 0%, transparent 60%), linear-gradient(170deg,#28303a,#151a16 70%); }
  .stage.light { background: radial-gradient(120% 70% at 30% 80%, #c9c2a8 0%, transparent 60%), radial-gradient(90% 60% at 80% 20%, #dfe6ec 0%, transparent 60%), linear-gradient(170deg,#e9e6dd,#bfb9a5 70%); }
  .stage.check { background-color:#1d1d20; background-image:linear-gradient(45deg,#2a2a2e 25%,transparent 25%),linear-gradient(-45deg,#2a2a2e 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#2a2a2e 75%),linear-gradient(-45deg,transparent 75%,#2a2a2e 75%); background-size:20px 20px; background-position:0 0,0 10px,10px -10px,-10px 0; }
  canvas { display:block; width:100%; height:auto; }
  .ms { position:absolute; right:12px; bottom:10px; font-size:11px; color:var(--label2); font-variant-numeric:tabular-nums; }
  .desc { color:var(--label2); font-size:14px; line-height:1.5; margin:12px 2px 0; min-height:42px; }
  .desc b { color:#fff; font-weight:600; }
  .row2 { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-top:12px; }
  .row2 input[type=text], .row2 select { font:inherit; font-size:15px; color:#fff; background:var(--fill); border:0; border-radius:10px; padding:9px 12px; }
  .row2 input[type=text] { flex:1; min-width:150px; }
  .row2 textarea { font:inherit; font-size:15px; line-height:1.35; color:#fff; background:var(--fill); border:0; border-radius:10px; padding:9px 12px; flex:1 1 100%; min-width:150px; resize:none; overflow:hidden; }
  label.mini { display:inline-flex; align-items:center; gap:8px; font-size:13px; color:var(--label2); }
  label.mini input { width:110px; }
  .seg { display:inline-grid; grid-auto-flow:column; background:var(--fill); border-radius:9px; padding:2px; }
  .seg button { font:inherit; font-size:13px; font-weight:600; color:#fff; background:transparent; border:0; border-radius:7px; padding:7px 11px; cursor:pointer; }
  .seg button.on { background:#636366; }
  .btn { font:inherit; font-size:15px; font-weight:600; color:#fff; background:var(--tint); border:0; border-radius:12px; padding:10px 16px; cursor:pointer; }
  .btn.grey { background:var(--fill); }
  .controls { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:10px 18px; margin-top:14px; background:var(--panel); border-radius:18px; padding:16px; }
  label.r { display:grid; grid-template-columns:96px 1fr 40px; align-items:center; gap:10px; font-size:14px; }
  label.r span:last-child { text-align:right; color:var(--label2); font-variant-numeric:tabular-nums; }
  input[type=range] { -webkit-appearance:none; appearance:none; height:4px; border-radius:2px; background:var(--fill); outline-offset:6px; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:24px; height:24px; border-radius:50%; background:#fff; box-shadow:0 2px 6px rgba(0,0,0,.35); cursor:pointer; }
  input[type=range]::-moz-range-thumb { width:24px; height:24px; border:0; border-radius:50%; background:#fff; cursor:pointer; }
  #note { font-size:13px; color:var(--label2); }
</style>
</head>
<body>
<div class="page">
  <h1>Effects lab</h1>
  <p class="lede">Text effects, all drawn from scratch with a real transparent background, so any of them can sit on a photo or go on the big type in a card. Pick one, type your own text, and play with the sliders. Share saves a 1,200 px PNG.</p>

  <div class="fx" id="fx"></div>
  <div class="stage" id="stage"><canvas id="out" width="1200" height="480"></canvas><span class="ms" id="ms"></span></div>
  <p class="desc" id="desc"></p>

  <div class="row2">
    <textarea id="txt" rows="1" aria-label="Text (Return for a new line)" maxlength="80">10.2 KM</textarea>
    <span class="seg" id="align"><button data-a="left">Left</button><button data-a="center" class="on">Centre</button><button data-a="right">Right</button></span>
    <label class="mini">Line spacing <input type="range" id="lh" min="0.8" max="1.6" step="0.02" value="1.15"></label>
    <label class="mini">Letter spacing <input type="range" id="ls" min="-0.15" max="0.6" step="0.01" value="0"></label>
    <label class="mini">Wave <input type="range" id="wave" min="0" max="80" step="1" value="0"></label>
    <label class="mini">Wave size <input type="range" id="waveLen" min="80" max="800" step="10" value="320"></label>
    <label class="mini">Bulge <input type="range" id="bulge" min="0" max="100" step="1" value="0"></label>
    <select id="font" aria-label="Font">
      <option value="900 1px Rubik">Rubik Black</option>
      <option value="1px Anton">Anton</option>
      <option value="1px 'Archivo Black'">Archivo Black</option>
      <option value="1px 'Bowlby One'">Bowlby One</option>
      <option value="900 1px 'Big Shoulders Display'">Big Shoulders</option>
    </select>
    <span class="seg" id="bg"><button data-bg="photo" class="on">Photo</button><button data-bg="light">Light</button><button data-bg="black">Black</button><button data-bg="check">Transparent</button></span>
    <button class="btn grey" id="reset" type="button">Reset</button>
    <button class="btn" id="share" type="button">Share</button>
    <button class="btn grey" id="copy" type="button">Copy</button>
    <span id="note" role="status"></span>
  </div>

  <div class="controls" id="controls"></div>
</div>
<script>
// ─── Canvas + helpers ────────────────────────────────────────────────────────
const FW = 1200, FH = 480;
let W = FW, H = FH, N = W * H, TMP = new Float32Array(N), SC = 1;   // SC: px scale (0.5 for drafts)
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c };
const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
function rng(seed) { let s = seed >>> 0 || 1; return () => { s += 0x6D2B79F5; let t = s; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296 } }
function boxSizes(sigma, n) { const wl0 = Math.floor(Math.sqrt(12 * sigma * sigma / n + 1)), wl = wl0 % 2 ? wl0 : wl0 - 1, wu = wl + 2, m = Math.round((12 * sigma * sigma - n * wl * wl - 4 * n * wl - 3 * n) / (-4 * wl - 4)); return Array.from({ length: n }, (_, i) => ((i < m ? wl : wu) - 1) / 2) }
function boxBlur(src, r) {
  const k = 1 / (r + r + 1), cx = v => v < 0 ? 0 : v >= W ? W - 1 : v, cy = v => v < 0 ? 0 : v >= H ? H - 1 : v, tmp = TMP;
  for (let y = 0; y < H; y++) { const row = y * W; let acc = src[row] * (r + 1); for (let i = 1; i <= r; i++) acc += src[row + cx(i)]; for (let x = 0; x < W; x++) { tmp[row + x] = acc * k; acc += src[row + cx(x + r + 1)] - src[row + cx(x - r)] } }
  for (let x = 0; x < W; x++) { let acc = tmp[x] * (r + 1); for (let i = 1; i <= r; i++) acc += tmp[cy(i) * W + x]; for (let y = 0; y < H; y++) { src[y * W + x] = acc * k; acc += tmp[cy(y + r + 1) * W + x] - tmp[cy(y - r) * W + x] } }
}
function gauss(a, sigma) { if (sigma >= .6) boxSizes(sigma, 3).forEach(r => r >= 1 && boxBlur(a, Math.round(r))); return a }
function valueNoise(grid, seed) {
  const R = rng(seed), gw = Math.ceil(W / grid) + 2, gh = Math.ceil(H / grid) + 2, lat = new Float32Array(gw * gh).map(() => R()), out = new Float32Array(N), s = t => t * t * (3 - 2 * t);
  for (let y = 0; y < H; y++) { const gy = y / grid, y0 = gy | 0, ty = s(gy - y0); for (let x = 0; x < W; x++) { const gx = x / grid, x0 = gx | 0, tx = s(gx - x0), i = y0 * gw + x0, a = lat[i] + (lat[i + 1] - lat[i]) * tx, b = lat[i + gw] + (lat[i + gw + 1] - lat[i + gw]) * tx; out[y * W + x] = a + (b - a) * ty } }
  return out;
}
function hsl(h, s, l) { s /= 100; l /= 100; const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l), f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1))); return [f(0) * 255, f(8) * 255, f(4) * 255] }
const rgbStr = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
// Straight RGBA float buffers → ImageData
function toImage(R, G, B, A) { const img = new ImageData(W, H), o = img.data; for (let i = 0; i < N; i++) { const a = A[i]; if (a <= .002) continue; o[i * 4] = R[i]; o[i * 4 + 1] = G[i]; o[i * 4 + 2] = B[i]; o[i * 4 + 3] = clamp(a) * 255 } return img }

// Text layout + mask (shared by all effects)
let T = {};
// Size the block so the widest line fills ~80% of the width; extra lines make the image taller, not the text smaller.
function measureBlock(ctx, Wt) {
  ctx.font = T.font(100); const ms = T.lines.map(l => ctx.measureText(l)), lw = ms.map((m, i) => m.width + T.ls * 100 * Math.max(0, [...T.lines[i]].length - 1));
  const maxW = Math.max(...lw, 1), asc = Math.max(...ms.map(m => m.actualBoundingBoxAscent || 72)), desc = Math.max(...ms.map(m => m.actualBoundingBoxDescent || 0));
  const room = Wt - 2 * (T.padX || 0) * Wt / FW, fs = Math.min(100 * Math.min(Wt * .8, room * .92) / maxW, 100 * FH * (Wt / FW) * .52 / asc), k = fs / 100, step = asc * k * T.lh;
  return { fs, asc: asc * k, desc: desc * k, step, maxW: maxW * k, widths: lw.map(w => w * k), contentH: asc * k + (T.lines.length - 1) * step + desc * k };
}
function layout(ctx) {
  const m = measureBlock(ctx, W);
  T.fs = m.fs; T.lsPx = T.ls * m.fs; T.top = (H - m.contentH) / 2; T.bot = T.top + m.contentH; T.left = (W - m.maxW) / 2; T.right = T.left + m.maxW;
  T.ys = T.lines.map((_, i) => T.top + m.asc + i * m.step); T.ty = T.ys[0]; T.widths = m.widths;
  T.tx = T.align === 'left' ? T.left : T.align === 'right' ? T.right : W / 2;
}
function drawLines(ctx, method, dx = 0, dy = 0) {
  if (!T.lsPx) { T.lines.forEach((l, i) => ctx[method](l, T.tx + dx, T.ys[i] + dy)); return }
  const align = ctx.textAlign; ctx.textAlign = 'left';
  T.lines.forEach((l, li) => {
    const chars = [...l], w = T.widths[li];
    let x = (T.align === 'left' ? T.left : T.align === 'right' ? T.right - w : W / 2 - w / 2) + dx;
    chars.forEach((ch, i) => {
      ctx[method](ch, x, T.ys[li] + dy);
      const pre = chars.slice(0, i).join(''), adv = ctx.measureText(pre + ch).width - ctx.measureText(pre).width;   // keeps the font's kerning
      x += adv + T.lsPx;
    });
  });
  ctx.textAlign = align;
}
function setText(ctx, size = T.fs) { ctx.font = T.font(size); ctx.textAlign = T.align || 'center'; ctx.textBaseline = 'alphabetic' }
// Global text warp (Wave, Wave size, Bulge). Output pixels sample the flat text through an inverse mapping.
let WARP = { wave: 0, waveLen: 320, bulge: 0 };
function warpCanvas(c) {
  const x = c.getContext('2d'), s = x.getImageData(0, 0, W, H).data, out = x.createImageData(W, H), o = out.data;
  const A = WARP.wave * SC, L = Math.max(20, WARP.waveLen * SC), B = WARP.bulge / 100 * .55;
  const cx = (T.left + T.right) / 2, cy = (T.top + T.bot) / 2, Rb = Math.max(1, (T.right - T.left) / 2 * 1.05);
  const al = (X, Y) => (X < 0 || Y < 0 || X >= W || Y >= H) ? 0 : s[(Y * W + X) * 4 + 3];
  for (let y = 0; y < H; y++) for (let xx = 0; xx < W; xx++) {
    let sx = xx, sy = y;
    if (B) { const nx = (xx - cx) / Rb, ny = (y - cy) / Rb, r2 = nx * nx + ny * ny; if (r2 < 1) { const f = 1 - B * (1 - r2) * (1 - r2); sx = cx + (xx - cx) * f; sy = cy + (y - cy) * f } }   // magnify the middle
    if (A) sy -= A * Math.sin((sx - T.left) / L * 2 * Math.PI);                                                                                                // vertical wave along the line
    const x0 = Math.floor(sx), y0 = Math.floor(sy), fx = sx - x0, fy = sy - y0;
    const v = (al(x0, y0) * (1 - fx) + al(x0 + 1, y0) * fx) * (1 - fy) + (al(x0, y0 + 1) * (1 - fx) + al(x0 + 1, y0 + 1) * fx) * fy;
    if (v > 0) { const i = (y * W + xx) * 4; o[i] = o[i + 1] = o[i + 2] = 255; o[i + 3] = v }
  }
  x.putImageData(out, 0, 0);
}
function textCanvas(dx = 0, dy = 0) { const c = mk(W, H), x = c.getContext('2d'); setText(x); x.fillStyle = '#fff'; drawLines(x, 'fillText', dx, dy); if (WARP.wave || WARP.bulge) warpCanvas(c); return c }
function maskArray(dx = 0, dy = 0) { const p = textCanvas(dx, dy).getContext('2d').getImageData(0, 0, W, H).data, M = new Float32Array(N); for (let i = 0; i < N; i++) M[i] = p[i * 4 + 3] / 255; return M }
// Left edges of each character so effects can treat letters separately
function charBoxes(ctx) {
  setText(ctx); const out = [];
  T.lines.forEach((line, li) => {
    const lw = ctx.measureText(line).width; let x = T.align === 'left' ? T.left : T.align === 'right' ? T.right - lw : W / 2 - lw / 2;
    [...line].forEach((ch, i) => { const adv = ctx.measureText(line.slice(0, i + 1)).width - ctx.measureText(line.slice(0, i)).width; out.push({ ch, x, y: T.ys[li], cx: x + adv / 2, w: ctx.measureText(ch).width }); x += adv });
  });
  return out;
}


// ─── Effects ─────────────────────────────────────────────────────────────────
// controls: [key, label, min, max, default, isPixels]
const FX = [
  { key: 'ghost', group: 'Light', pad: P => { const a = P.angle * Math.PI / 180, e = P.blur * (1 + P.decay / 100 * 5) * 2 + P.glow * 2; return { x: Math.abs(Math.cos(a)) * P.len + e, y: Math.abs(Math.sin(a)) * P.len + e } }, name: 'Ghost', desc: '<b>Ghost.</b> A cream face with a long, soft trail of fading copies behind it, pink near the letters and deep purple at the far end, with a pink glow and grain. Decay makes the tail fall apart: further copies get blurrier, fainter and grainier.',
    controls: [['len', 'Trail length', 0, 300, 170, 1], ['copies', 'Copies', 2, 60, 16], ['angle', 'Angle', 0, 360, 318], ['blur', 'Trail blur', 0, 30, 3, 1], ['decay', 'Decay', 0, 100, 70], ['hue', 'Trail colour', 0, 360, 300], ['glow', 'Glow', 0, 40, 14, 1], ['grain', 'Grain', 0, 100, 45]],
    render(ctx, P) {
      const M = maskArray(), ang = P.angle * Math.PI / 180, dx = Math.cos(ang), dy = -Math.sin(ang);
      const steps = Math.max(1, Math.round(P.copies)), dec = P.decay / 100, BANDS = 4;
      // The trail is built in bands along its length; each band further from the letters is fainter and blurrier.
      const bA = Array.from({ length: BANDS }, () => new Float32Array(N)), bT = Array.from({ length: BANDS }, () => new Float32Array(N));
      for (let s = steps; s >= 1 && P.len > 0; s--) {
        const t = s / steps, ox = Math.round(dx * P.len * t), oy = Math.round(dy * P.len * t), b = Math.min(BANDS - 1, Math.floor(t * BANDS));
        const w = (Math.pow(1 - t, .35) * .8 + .2) * (1 - dec * .7 * t), Ba = bA[b], Bt = bT[b];
        for (let y = Math.max(0, oy); y < Math.min(H, H + oy); y++) {
          const row = y * W, srow = (y - oy) * W;
          for (let x = Math.max(0, ox); x < Math.min(W, W + ox); x++) { const a = M[srow + x - ox] * w; if (a > Ba[row + x]) { Ba[row + x] = a; Bt[row + x] = t } }
        }
      }
      // Blur each band (more blur toward the tail), then stack them far → near so nearer copies sit on top
      const Ta = new Float32Array(N), TtA = new Float32Array(N);
      for (let b = BANDS - 1; b >= 0; b--) {
        const Ba = bA[b], Bt = bT[b], sig = P.blur * (1 + dec * 5 * (b + .5) / BANDS);
        for (let i = 0; i < N; i++) Bt[i] *= Ba[i];
        gauss(Ba, sig); gauss(Bt, sig);
        for (let i = 0; i < N; i++) { const a = Math.min(1, Ba[i]); if (a <= 0) continue; const keep = 1 - a; TtA[i] = Bt[i] + TtA[i] * keep; Ta[i] = a + Ta[i] * keep }
      }
      const G = P.glow > 0 ? gauss(Float32Array.from(M), P.glow) : null;
      const near = hsl(P.hue, 95, 70), far = hsl(P.hue - 35, 85, 34), gc = hsl(P.hue, 100, 78), face = [255, 243, 226], R = rng(11), g = P.grain / 100;
      const oR = new Float32Array(N), oG = new Float32Array(N), oB = new Float32Array(N), oA = new Float32Array(N);
      for (let i = 0; i < N; i++) {
        const ta = Math.min(1, Ta[i]), tt = ta > .001 ? TtA[i] / Ta[i] : 0, ga = G ? Math.min(1, G[i] * .9) : 0, fa = M[i];
        // trail, then glow over it
        let r = lerp(near[0], far[0], tt), gr = lerp(near[1], far[1], tt), b = lerp(near[2], far[2], tt), a = ta;
        if (ga > 0) { const na = ga + a * (1 - ga); r = (gc[0] * ga + r * a * (1 - ga)) / (na || 1); gr = (gc[1] * ga + gr * a * (1 - ga)) / (na || 1); b = (gc[2] * ga + b * a * (1 - ga)) / (na || 1); a = na }
        const lg = Math.min(1, g + (1 - g) * dec * tt * .9);                    // more dissolve further down the tail
        if (lg > 0 && a > 0) a = a * (1 - lg) + (a * 1.3 > R() ? 1 : 0) * lg;   // grain in the trail and glow, not the face
        const oa = fa + a * (1 - fa); if (oa < .004) continue;
        oA[i] = oa; oR[i] = (face[0] * fa + r * a * (1 - fa)) / oa; oG[i] = (face[1] * fa + gr * a * (1 - fa)) / oa; oB[i] = (face[2] * fa + b * a * (1 - fa)) / oa;
      }
      ctx.putImageData(toImage(oR, oG, oB, oA), 0, 0);
    } },
  { key: 'spectrum', group: 'Light', pad: P => ({ x: P.glow * 2, y: P.len * 1.15 + P.glow * 2 }), name: 'Spectrum', desc: '<b>Spectrum.</b> Every letter drips into a streak of light that fades away, coloured in a rainbow across the word, with uneven streaks and grain. Turn on Upwards to send the streaks the other way.',
    controls: [['len', 'Streak length', 0, 500, 260, 1], ['hue', 'Start colour', 0, 360, 0], ['range', 'Rainbow width', 0, 360, 150], ['texture', 'Streakiness', 0, 100, 55], ['glow', 'Glow', 0, 30, 8, 1], ['grain', 'Grain', 0, 100, 35], ['up', 'Upwards', 0, 1, 0]],
    render(ctx, P) {
      const M = maskArray(), S = new Float32Array(N), dec = P.len > 0 ? Math.exp(-3 / Math.max(1, P.len)) : 0, up = P.up >= .5;
      for (let x = 0; x < W; x++) {   // each column carries the letter's light along, fading as it goes
        let c = 0;
        if (!up) for (let y = 0; y < H; y++) { const i = y * W + x; c = Math.max(M[i], c * dec); if (c < .04) c = 0; S[i] = c }   // end the streak cleanly
        else for (let y = H - 1; y >= 0; y--) { const i = y * W + x; c = Math.max(M[i], c * dec); if (c < .04) c = 0; S[i] = c }   // end the streak cleanly
      }
      // Uneven streaks: a smooth random brightness per column
      const R1 = rng(17), step = Math.max(2, Math.round(7 * SC)), lat = Array.from({ length: Math.ceil(W / step) + 2 }, () => R1()), tex = P.texture / 100;

// ─── UI ──────────────────────────────────────────────────────────────────────
const VALS = Object.fromEntries(FX.map(f => [f.key, Object.fromEntries(f.controls.map(c => [c[0], c[4]]))]));
let cur = FX[0];
function buildFxBar() {
  let g = '';
  document.getElementById('fx').innerHTML = FX.map(f => { const head = f.group !== g ? `<span class="grp">${(g = f.group)}</span>` : ''; return `${head}<button data-k="${f.key}" class="${f === cur ? 'on' : ''}">${f.name}</button>` }).join('');
  document.querySelectorAll('#fx button').forEach(b => b.onclick = () => { cur = FX.find(f => f.key === b.dataset.k); buildFxBar(); buildControls(); schedule() });
}
function buildControls() {
  const V = VALS[cur.key];
  document.getElementById('controls').innerHTML = cur.controls.map(([k, l, mn, mx]) => `<label class="r"><span>${l}</span><input type="range" id="s-${k}" min="${mn}" max="${mx}" step="${mx - mn <= 3 ? 1 : (mx - mn > 20 ? 1 : .5)}" value="${V[k]}"><span id="v-${k}">${V[k]}</span></label>`).join('');
  cur.controls.forEach(([k]) => { const s = document.getElementById('s-' + k); s.addEventListener('input', () => { V[k] = +s.value; document.getElementById('v-' + k).textContent = V[k]; schedule(true) }); s.addEventListener('change', () => schedule(false)) });
  document.getElementById('desc').innerHTML = cur.desc;
}
document.getElementById('reset').onclick = () => { cur.controls.forEach(c => VALS[cur.key][c[0]] = c[4]); buildControls(); schedule() };
document.querySelectorAll('#bg button').forEach(b => b.onclick = () => { document.getElementById('stage').className = 'stage' + (b.dataset.bg === 'black' ? '' : ' ' + b.dataset.bg); document.querySelectorAll('#bg button').forEach(x => x.classList.toggle('on', x === b)) });
let ALIGN = 'center';
const txt = document.getElementById('txt'), grow = () => { txt.rows = Math.max(1, txt.value.split('\n').length) };
txt.addEventListener('input', () => { grow(); schedule() }); grow();
document.querySelectorAll('#align button').forEach(b => b.onclick = () => { ALIGN = b.dataset.a; document.querySelectorAll('#align button').forEach(x => x.classList.toggle('on', x === b)); schedule() });
document.getElementById('lh').addEventListener('input', () => schedule(true));
document.getElementById('lh').addEventListener('change', () => schedule(false));
document.getElementById('ls').addEventListener('input', () => schedule(true));
document.getElementById('ls').addEventListener('change', () => schedule(false));
['wave', 'waveLen', 'bulge'].forEach(k => { const el = document.getElementById(k); el.addEventListener('input', () => { WARP[k] = +el.value; schedule(true) }); el.addEventListener('change', () => schedule(false)) });
document.getElementById('font').addEventListener('change', () => schedule());

async function draw(draft = false) {
  const t0 = performance.now(), d = draft ? .5 : 1;
  const fontSpec = document.getElementById('font').value, raw = document.getElementById('txt').value.replace(/\s+$/, '');
  const lines = (raw || ' ').split('\n').map(l => l.trimEnd() || ' ');
  T = { text: lines.join(' '), lines, align: ALIGN, lh: +document.getElementById('lh').value, ls: +document.getElementById('ls').value, font: n => fontSpec.replace('1px', n + 'px') };
  await document.fonts.load(T.font(100), T.text);
  // Height grows with the number of lines (room around the block for glows and shadows)
  const pad = cur.pad ? cur.pad(VALS[cur.key]) : { x: 0, y: 0 }; T.padX = pad.x;
  const blockH = measureBlock(document.createElement('canvas').getContext('2d'), FW).contentH;
  const fullH = Math.max(FH, Math.ceil(blockH + FH * .5 + WARP.wave * 2 + WARP.bulge / 100 * blockH * 1.1 + pad.y * 2));
  W = Math.round(FW * d); H = Math.round(fullH * d); N = W * H; SC = d; if (TMP.length !== N) TMP = new Float32Array(N);
  const cv = document.getElementById('out'); if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H }
  const ctx = cv.getContext('2d'); ctx.clearRect(0, 0, W, H); ctx.save(); layout(ctx);
  const P = {}; cur.controls.forEach(([k, , , , , px]) => P[k] = VALS[cur.key][k] * (px ? d : 1));
  cur.render(ctx, P); ctx.restore();
  document.getElementById('ms').textContent = (draft ? 'preview ' : '') + Math.round(performance.now() - t0) + ' ms';

// Quick half-res drafts while a slider is held; full quality otherwise.
let timer = 0, busy = false, pending = null;
function schedule(draft = false) { clearTimeout(timer); timer = setTimeout(() => run(draft), draft ? 0 : 60) }
async function run(draft) { if (busy) { pending = pending === false ? false : draft; return } busy = true; try { await draw(draft) } finally { busy = false } if (pending !== null) { const p = pending; pending = null; run(p) } }

// Share / Copy the full-quality PNG
async function pngBlob() { if (document.getElementById('out').width !== FW) await draw(false); return new Promise(r => document.getElementById('out').toBlob(r, 'image/png')) }
const note = t => { const n = document.getElementById('note'); n.textContent = t; clearTimeout(note.t); note.t = setTimeout(() => n.textContent = '', 4000) };

  const a = document.createElement('a'); a.download = file.name; a.href = URL.createObjectURL(file); a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);

document.getElementById('copy').onclick = async () => {
  try { await navigator.clipboard.write([new ClipboardItem({ 'image/png': pngBlob() })]); note('Copied. In your Story, tap and choose Paste.') }
  catch (e) { note("Copy isn't supported here. Use Share instead.") }
};

buildFxBar(); buildControls();
document.fonts.ready.then(() => schedule());
