      <div class="sliders" id="controls"></div>

    <section class="card">

      <div class="row" style="margin:0 0 14px">
        <select id="font" aria-label="Font">

          <option value="900 1px Rubik">Rubik Black</option>
          <option value="1px Anton">Anton</option>
          <option value="1px 'Archivo Black'">Archivo Black</option>
          <option value="1px 'Bowlby One'">Bowlby One</option>
          <option value="900 1px 'Big Shoulders Display'">Big Shoulders</option>
          <option value="1px 'Dela Gothic One'">Dela Gothic (extra fat)</option>
          <option value="1px 'Rubik Mono One'">Rubik Mono (blocky)</option>
          <option value="1px 'Gasoek One'">Gasoek One (ultra heavy)</option>
          <option value="1px 'Titan One'">Titan One (chunky)</option>
          <option value="1px 'Dakota Rough'">Dakota Rough (hand drawn)</option>

        <label class="r"><span>Letter spacing</span><input type="range" id="ls" min="-0.15" max="0.6" step="0.01" value="0"><span data-for="ls">0</span></label>
      </div>
    </section>

    <section class="card">

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

        for (let x = 0; x < W; x++) { let c = 0; for (let y = H - 1; y >= 0; y--) { const i = y * W + x, len = Lmax * Math.pow(vn[i], 1.25) * (.4 + vt[i] * 1.2); c = Math.max(M[i], len > 1 ? c * Math.exp(-2.6 / len) : 0); F[i] = c } }

      }

      const oR = new Float32Array(N), oG = new Float32Array(N), oB = new Float32Array(N), oA = new Float32Array(N);

        if (g > 0 && h < .3) a = (a * (1 - g) + (a * 1.3 > R() ? 1 : 0) * g) * clamp((h - .04) / .1);   // grain fades out with the heat, so it stays around the letters
        oA[i] = a; oR[i] = c[0]; oG[i] = c[1]; oB[i] = c[2];
      }
      ctx.putImageData(toImage(oR, oG, oB, oA), 0, 0);
    } },
  { key: 'melt', pad: P => ({ x: 0, y: P.len * .55 }), name: 'Melt', desc: '<b>Melt.</b> The letters drip like wet paint, with rounded drops of different lengths running off their bottoms. Pattern reshuffles where the drips fall. Keep shape stops drips running out of the gaps inside letters, so long drips stay readable.',
    controls: [['len', 'Drip length', 0, 300, 140, 1], ['drips', 'Drips', 0, 100, 45], ['thick', 'Drip width', 3, 30, 11, 1], ['goo', 'Gooeyness', 0, 100, 50], ['keep', 'Keep shape', 0, 100, 65], ['hue', 'Colour', 0, 360, 110], ['sat', 'Saturation', 0, 100, 0], ['seed', 'Pattern', 1, 40, 4]],
    render(ctx, P) {

      for (let y = 0; y < H; y++) { const b = T.ys.reduce((p, v) => Math.abs(v - y) < Math.abs(p - y) ? v : p, T.ys[0]); nearBase[y] = y >= b - tol ? 1 : 0 }
      for (let x = 0; x < W; x++) { let below = 1e9; for (let y = H - 1; y >= 0; y--) { const i = y * W + x; if (M[i] > .5) { if (nearBase[y] && below - y > gapMin && (y === H - 1 || M[i + W] <= .5)) start[i] = 1; below = y } } }
      for (let x = 0; x < W; x++) { let last = -1e9; for (let y = 0; y < H; y++) { const i = y * W + x; if (start[i]) last = y; else if (M[i] > .5) last = -1e9; S[i] = Math.max(M[i], y - last < len[x] ? 1 : 0) } }
      const gs = .6 + P.goo / 100 * 6, Gs = gauss(S, gs), col = hsl(P.hue, P.sat, P.sat ? 55 : 100);
      const oR = new Float32Array(N).fill(col[0]), oG = new Float32Array(N).fill(col[1]), oB = new Float32Array(N).fill(col[2]), oA = new Float32Array(N);
      const Dr = new Float32Array(N); for (let i = 0; i < N; i++) Dr[i] = M[i] > .5 ? 0 : S[i];
      const near = gauss(Dr, gs * 1.5 + 1);   // goo only where the drips are, so notches and gaps inside letters stay open
      for (let i = 0; i < N; i++) { const v = Gs[i], g = v <= .38 ? 0 : v >= .52 ? 1 : (v - .38) / .14; oA[i] = Math.max(M[i], g * lerp(1, clamp(near[i] * 5), kp)) }

    } },
  { key: 'halftone', pad: P => ({ x: P.spread * 2, y: P.spread * 2 }), name: 'Halftone', desc: '<b>Halftone.</b> The text rebuilt from printed dots on an angled grid. Spread lets the dots shrink away softly around the letters, like a comic or a screen print. Solid core keeps the middle of each letter solid, so the dots only start that far in from the edge.',
    controls: [['cell', 'Dot size', 4, 28, 10, 1], ['angle', 'Angle', 0, 90, 45], ['core', 'Solid core', 0, 40, 1, 1], ['spread', 'Spread', 0, 40, 10, 1], ['gain', 'Ink', 50, 200, 110], ['hue', 'Colour', 0, 360, 0], ['sat', 'Saturation', 0, 100, 0]],
    render(ctx, P) {
      const M = maskArray(), Tn = P.spread > 0 ? gauss(Float32Array.from(M), P.spread) : M, c = Math.max(2, P.cell), a = P.angle * Math.PI / 180, ca = Math.cos(a), sa = Math.sin(a), k = P.gain / 100;
      const col = hsl(P.hue, P.sat, P.sat ? 55 : 100), oA = new Float32Array(N), Din = P.core > 0 ? distanceField(M.map(v => 1 - v)) : null;   // distance in from the letter edge
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
        const u = x * ca + y * sa, v = -x * sa + y * ca, cu = (Math.floor(u / c) + .5) * c, cv = (Math.floor(v / c) + .5) * c;
        const sx = Math.round(cu * ca - cv * sa), sy = Math.round(cu * sa + cv * ca);   // tone at the dot centre

      ctx.putImageData(toImage(new Float32Array(N).fill(col[0]), new Float32Array(N).fill(col[1]), new Float32Array(N).fill(col[2]), oA), 0, 0);
    } },
  { key: 'spray', pad: P => ({ x: P.spray * 2.2 + 6, y: P.spray * 2.2 + 6 }), name: 'Spray', desc: '<b>Spray.</b> Stencil spray paint or a burnt photocopy: solid letters with fibrous, eroded edges, a dusting of overspray around them and worn patches inside. Set Lightness to 0 for black ink.',
    controls: [['spray', 'Overspray', 0, 40, 14, 1], ['dust', 'Dust', 0, 100, 55], ['rough', 'Rough edges', 0, 100, 60], ['wear', 'Wear', 0, 100, 30], ['grit', 'Grit size', 1, 4, 1, 1], ['hue', 'Ink colour', 0, 360, 0], ['sat', 'Saturation', 0, 100, 0], ['light', 'Lightness', 0, 100, 100], ['seed', 'Pattern', 1, 40, 8]],

      const gs = Math.max(1, Math.round(P.grit * SC)), gw = Math.ceil(W / gs), R0 = rng(P.seed), fine = new Float32Array(gw * Math.ceil(H / gs)).map(() => R0());

];

// ─── UI ──────────────────────────────────────────────────────────────────────
const VALS = Object.fromEntries(FX.map(f => [f.key, Object.fromEntries(f.controls.map(c => [c[0], c[4]]))]));
let cur = FX[0];
function buildFxBar() {
  document.getElementById('fx').innerHTML = FX.map(f => { return `<button data-k="${f.key}" class="${f === cur ? 'on' : ''}" role="tab" aria-selected="${f === cur}" title="${f.desc.replace(/<[^>]+>/g, '').replace(/"/g, '&quot;')}">${f.name}</button>` }).join('');
  document.querySelectorAll('#fx button').forEach(b => b.onclick = () => { cur = FX.find(f => f.key === b.dataset.k); buildFxBar(); buildControls(); schedule() });
  document.querySelector('#fx button.on')?.scrollIntoView({ inline: 'nearest', block: 'nearest' });
}
function buildControls() {
  const V = VALS[cur.key];
  document.getElementById('controls').innerHTML = cur.controls.map(([k, l, mn, mx]) => `<label class="r"><span>${l}</span><input type="range" id="s-${k}" min="${mn}" max="${mx}" step="${mx - mn <= 3 ? 1 : (mx - mn > 20 ? 1 : .5)}" value="${V[k]}"><span id="v-${k}">${V[k]}</span></label>`).join('');
  cur.controls.forEach(([k]) => { const s = document.getElementById('s-' + k); s.addEventListener('input', () => { V[k] = +s.value; document.getElementById('v-' + k).textContent = V[k]; schedule(true) }); s.addEventListener('change', () => schedule(false)) });
  document.getElementById('fxTitle').textContent = cur.name;
}
document.getElementById('reset').onclick = () => { cur.controls.forEach(c => VALS[cur.key][c[0]] = c[4]); buildControls(); schedule() };
// Backdrop: one swatch button cycles Photo, Light, Black, Clear and briefly shows the name
const BGS = [['photo', 'Photo'], ['light', 'Light'], ['black', 'Black'], ['check', 'Clear']];
document.getElementById('bgBtn').onclick = function () {
  const n = BGS[(BGS.findIndex(b => b[0] === this.dataset.bg) + 1) % BGS.length];
  this.dataset.bg = n[0]; this.setAttribute('aria-label', `Preview backdrop: ${n[1]}. Tap to change`);
  document.getElementById('stage').className = 'stage' + (n[0] === 'black' ? '' : ' ' + n[0]);
  const lab = document.getElementById('bgName'); lab.textContent = n[1]; lab.classList.add('show'); clearTimeout(lab.t); lab.t = setTimeout(() => lab.classList.remove('show'), 1100);
};
let ALIGN = 'center';
const txt = document.getElementById('txt'), grow = () => { txt.rows = Math.max(1, txt.value.split('\n').length) };
// Text is edited on the preview: the pencil (or a tap on the image) opens the field under it, Done closes it.
const tedit = document.getElementById('tedit'), editBtn = document.getElementById('editBtn');
function setEditing(on) { tedit.hidden = !on; editBtn.setAttribute('aria-expanded', on); if (on) { grow(); txt.focus(); txt.setSelectionRange(txt.value.length, txt.value.length) } }
editBtn.onclick = () => setEditing(tedit.hidden);
document.getElementById('out').addEventListener('click', () => { if (!dragged) setEditing(true) });

// Zoom: + and - step through the levels (back to 100% resets), drag to look around while zoomed in
const ZL = [1, 1.5, 2, 3, 4], outEl = document.getElementById('out'), stageEl = document.getElementById('stage');
let Z = 1, PX = 0, PY = 0, dragged = false;
function applyZoom() {
  const mx = outEl.offsetWidth * (Z - 1) / 2, my = outEl.offsetHeight * (Z - 1) / 2;
  PX = clamp(PX, -mx, mx); PY = clamp(PY, -my, my);
  outEl.style.transform = Z === 1 ? '' : `translate(${PX}px, ${PY}px) scale(${Z})`;
  document.getElementById('zOut').disabled = Z === ZL[0]; document.getElementById('zIn').disabled = Z === ZL[ZL.length - 1];
  stageEl.classList.toggle('zoomed', Z > 1); stageEl.style.touchAction = Z > 1 ? 'none' : '';
}
document.getElementById('zIn').onclick = () => { Z = ZL[Math.min(ZL.length - 1, ZL.indexOf(Z) + 1)]; applyZoom() };
document.getElementById('zOut').onclick = () => { Z = ZL[Math.max(0, ZL.indexOf(Z) - 1)]; if (Z === 1) PX = PY = 0; applyZoom() };
outEl.addEventListener('pointerdown', e => {
  dragged = false; if (Z === 1) return;
  const x0 = e.clientX, y0 = e.clientY, px0 = PX, py0 = PY; outEl.setPointerCapture(e.pointerId); outEl.style.transition = 'opacity .25s';
  const move = ev => { const dx = ev.clientX - x0, dy = ev.clientY - y0; if (Math.abs(dx) + Math.abs(dy) > 4) dragged = true; PX = px0 + dx; PY = py0 + dy; applyZoom() };
  const up = () => { outEl.removeEventListener('pointermove', move); outEl.removeEventListener('pointerup', up); outEl.removeEventListener('pointercancel', up); outEl.style.transition = '' };
  outEl.addEventListener('pointermove', move); outEl.addEventListener('pointerup', up); outEl.addEventListener('pointercancel', up);
});
applyZoom();
document.getElementById('tdone').onclick = () => setEditing(false);
txt.addEventListener('input', () => { grow(); schedule() }); grow();
document.querySelectorAll('#align button').forEach(b => b.onclick = () => { ALIGN = b.dataset.a; document.querySelectorAll('#align button').forEach(x => x.classList.toggle('on', x === b)); schedule() });
document.getElementById('lh').addEventListener('input', () => schedule(true));
document.getElementById('lh').addEventListener('change', () => schedule(false));
document.getElementById('ls').addEventListener('input', () => schedule(true));
document.getElementById('ls').addEventListener('change', () => schedule(false));
function setShape(k) {
  WARP.shape = k; document.querySelectorAll('#shapes button').forEach(b => { const on = b.dataset.s === k; b.classList.toggle('on', on); b.setAttribute('aria-checked', on) });
  document.getElementById('amtRow').hidden = k === 'none';
  // Perspective and Barrel get messy past these, so their slider stops there
  const L = { persp: 40, barrel: 50 }[k] || 100, el = document.getElementById('amt');
  el.min = -L; el.max = L; WARP.amt = setRange('amt', clamp(WARP.amt, -L, L));
}
document.querySelectorAll('#shapes button').forEach(b => b.onclick = () => { setShape(b.dataset.s); schedule() });
['wave', 'waveLen', 'bulge', 'amt'].forEach(k => { const el = document.getElementById(k); el.addEventListener('input', () => { WARP[k] = +el.value; schedule(true) }); el.addEventListener('change', () => schedule(false)) });
document.getElementById('font').addEventListener('change', () => schedule());

async function draw(draft = false) {
  const t0 = performance.now(), d = draft ? .5 : 1;
  const fontSpec = document.getElementById('font').value, raw = document.getElementById('txt').value.replace(/\s+$/, '');
  const lines = (raw || ' ').split('\n').map(l => l.trimEnd() || ' ');
  T = { text: lines.join(' '), lines, align: ALIGN, lh: +document.getElementById('lh').value, ls: +document.getElementById('ls').value, font: n => fontSpec.replace('1px', n + 'px') };
  await document.fonts.load(T.font(100), T.text);
  // Height grows with the number of lines (room around the block for glows and shadows)
  const pad = cur.pad ? cur.pad(VALS[cur.key]) : { x: 0, y: 0 }, shp = shapeOn() ? SHAPES[WARP.shape] : null, sk = shp ? Math.abs(WARP.amt) / 100 : 0;
  T.padX = pad.x + (shp ? FW * Math.max(0, 1 - .8 / (.92 * (1 + shp.grow * sk))) / 2 : 0);
  const blockH = measureBlock(document.createElement('canvas').getContext('2d'), FW).contentH;
  const fullH = Math.max(FH, Math.ceil(blockH + FH * .5 + WARP.wave * 2 + WARP.bulge / 100 * blockH * 1.8 + (shp ? shp.tall * sk * blockH : 0) + pad.y * 2));
  W = Math.round(FW * d); H = Math.round(fullH * d); N = W * H; SC = d; if (TMP.length !== N) TMP = new Float32Array(N);
  const cv = document.getElementById('out'); if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H }
  const ctx = cv.getContext('2d'); ctx.clearRect(0, 0, W, H); ctx.save(); layout(ctx);
  const P = {}; cur.controls.forEach(([k, , , , , px]) => P[k] = VALS[cur.key][k] * (px ? d : 1));
  cur.render(ctx, P); ctx.restore();
  document.getElementById('ms').textContent = (draft ? 'preview ' : '') + Math.round(performance.now() - t0) + ' ms';
  cv.style.opacity = '';   // undo the Randomise dim once the new look is drawn
}
// Quick half-res drafts while a slider is held; full quality otherwise.
let timer = 0, busy = false, pending = null;
function schedule(draft = false) { clearTimeout(timer); timer = setTimeout(() => run(draft), draft ? 0 : 60) }
async function run(draft) { if (busy) { pending = pending === false ? false : draft; return } busy = true; try { await draw(draft) } finally { busy = false } if (pending !== null) { const p = pending; pending = null; run(p) } }

// Share / Copy the full-quality PNG
async function pngBlob() { if (document.getElementById('out').width !== FW) await draw(false); return new Promise(r => document.getElementById('out').toBlob(r, 'image/png')) }
// Feedback: a toast above the buttons, plus a quick press animation on the button
const note = (t, ms = 2400) => { const n = document.getElementById('toast'); n.textContent = t; n.classList.add('show'); clearTimeout(note.t); note.t = setTimeout(() => n.classList.remove('show'), ms) };
function pop(btn, doneLabel) {
  btn.classList.remove('pop'); void btn.offsetWidth; btn.classList.add('pop');
  if (doneLabel) { const was = btn.dataset.label || (btn.dataset.label = btn.textContent); btn.textContent = doneLabel; btn.classList.add('done'); clearTimeout(btn.t); btn.t = setTimeout(() => { btn.textContent = was; btn.classList.remove('done') }, 1600) }
}
document.getElementById('share').onclick = async () => {
  const file = new File([await pngBlob()], cur.key + '.png', { type: 'image/png' });
  if (navigator.canShare?.({ files: [file] })) { try { await navigator.share({ files: [file] }) } catch (e) {} return }
  const a = document.createElement('a'); a.download = file.name; a.href = URL.createObjectURL(file); a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  note("Sharing isn't available in this browser, so it downloaded instead.");
};
document.getElementById('copy').onclick = async () => {
  const btn = document.getElementById('copy'); pop(btn);
  try { await navigator.clipboard.write([new ClipboardItem({ 'image/png': pngBlob() })]); pop(btn, 'Copied'); note('Copied. In your Story, tap and choose Paste.') }
  catch (e) { note("Copy isn't supported here. Use Share instead.") }
};

// Randomise: a random effect, font and alignment, every effect slider anywhere in its range, plus gentle spacing and shape.
const rnd = (a, b) => a + Math.random() * (b - a);
// Narrower random ranges where the full slider range gets too wild
const RAND_RANGE = { vhs: { shift: [4, 34], count: [8, 38], split: [1, 9], lines: [0, 45] } };
function setRange(id, v) { const el = document.getElementById(id); el.value = v; const lab = document.querySelector(`[data-for="${id}"]`); if (lab) lab.textContent = el.value; return +el.value }
document.getElementById('rand').onclick = () => {
  cur = FX[Math.floor(Math.random() * FX.length)];
  const V = VALS[cur.key];
  cur.controls.forEach(([k, , mn, mx]) => { [mn, mx] = RAND_RANGE[cur.key]?.[k] || [mn, mx]; const step = mx - mn <= 3 ? 1 : (mx - mn > 20 ? 1 : .5); V[k] = Math.round(rnd(mn, mx) / step) * step });
  const f = document.getElementById('font'); f.selectedIndex = Math.floor(Math.random() * f.options.length);
  const al = ['left', 'center', 'right'][Math.floor(Math.random() * 3)]; document.querySelector(`#align button[data-a="${al}"]`).click();
  setRange('lh', rnd(.9, 1.3).toFixed(2)); setRange('ls', rnd(-.06, .15).toFixed(2));
  WARP.wave = setRange('wave', Math.random() < .5 ? 0 : Math.round(rnd(5, 45)));
  WARP.waveLen = setRange('waveLen', Math.round(rnd(160, 700) / 10) * 10);
  WARP.bulge = setRange('bulge', Math.random() < .5 ? 0 : Math.round(rnd(15, 80)));
  setShape(Math.random() < .55 ? 'none' : ['arch', 'rise', 'persp', 'barrel'][Math.floor(Math.random() * 4)]);
  WARP.amt = setRange('amt', Math.round(rnd(30, 80)) * (Math.random() < .25 ? -1 : 1));
  buildFxBar(); buildControls(); schedule();
  pop(document.getElementById('rand')); document.getElementById('out').style.opacity = '.35';
  note(`${cur.name} · ${f.selectedOptions[0].text.replace(/ \(.*\)$/, '')}`, 1600);
};

buildFxBar(); buildControls();
document.fonts.ready.then(() => schedule());
document.querySelectorAll('[data-for]').forEach(v => { const el = document.getElementById(v.dataset.for); el.addEventListener('input', () => v.textContent = el.value) });
</script>
